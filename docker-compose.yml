version: '3.8'

services:
  # 1. The PostgreSQL Database Service
  postgres-db:
    image: postgres:15-alpine
    container_name: company-postgres-db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=company_db
      - POSTGRES_USER=db_user
      - POSTGRES_PASSWORD=db_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U db_user -d company_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Your Secure API Application Service
  secure-api:
    build: .
    container_name: company-secure-api
    ports:
      - "8081:8080"
    depends_on:
      postgres-db:
        condition: service_healthy # Wait until the database is fully ready before launching the app
    environment:
      - SPRING_DOCKER_COMPOSE_ENABLED=false
      - APP_JWT_SECRET=dGhpcy1pcy1hLXN1cGVyLXNlY3VyZS1hbmQtbG9uZy1zZWNyZXQta2V5LWZvci1qc29uLXdlYi10b2tlbnM=
      # Overriding database connection configurations dynamically inside the container network
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/company_db
      - SPRING_DATASOURCE_USERNAME=db_user
      - SPRING_DATASOURCE_PASSWORD=db_password
      - APP_JWT_EXPIRATION_MS=86400000

volumes:
  pgdata: # Keeps your database records safe even if you stop the containers
