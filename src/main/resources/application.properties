# Database Configurations with dynamic environmental fallback variables
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/company_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:db_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:db_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway migration support configurations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=TRACE
logging.level.com.hospital.auth=TRACE
